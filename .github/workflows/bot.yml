name: Binance Crypto Bot Continuous

on:
  schedule:
    # প্রতি ৫ ঘণ্টা পর পর নতুন জব ট্র্রিগার হয়ে গিটহাব রানার রিস্টার্ট করবে
    - cron: '0 */5 * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার বোতাম

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Continuous Trading Bot
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        run: python bot.py